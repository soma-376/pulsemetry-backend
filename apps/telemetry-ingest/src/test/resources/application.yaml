# 이 파일은 main 의 application.yaml 을 **대체**한다 — 같은 이름이라 클래스패스에서 먼저 잡힌다.
# 그래서 jpa 블록이 main 과 중복돼 보이지만 빼면 사라진다. main 에서 오는 값은 없다.
# 앱은 Flyway 를 끈다(enrollment-api 가 소유). 테스트는 격리된 Testcontainers 인스턴스라
# 스키마를 만들 주체가 없으므로 여기서만 켠다. :libs: 의 테스트 yaml 셋과 같은 형태다.
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: enrollment
    default-schema: enrollment

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: enrollment
    open-in-view: false
