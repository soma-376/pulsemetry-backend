# 이 파일은 main 의 application.yaml 을 **대체**한다 — 같은 이름이라 클래스패스에서 먼저 잡힌다.
# 그래서 jpa 블록이 main 과 중복돼 보이지만 빼면 사라진다. main 에서 오는 값은 없다.
# 앱은 Flyway 를 끈다(enrollment-api 가 소유). 테스트는 격리된 Testcontainers 인스턴스라
# 스키마를 만들 주체가 없으므로 여기서만 켠다. :libs: 의 테스트 yaml 셋과 같은 형태다.
spring:
  application:
    name: pulsemetry-telemetry-ingest
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: enrollment
    default-schema: enrollment

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: enrollment
    open-in-view: false

# 수집 운영 기록을 켠다 — E2E 가 ledger·요약까지 본다. telemetry_ops 스키마는 IngestTestData 가 적용한다
# (운영에서는 enrollment-api 기동의 몫이다, ADR 0021 §3).
pulsemetry:
  telemetry:
    ops:
      enabled: true
    # Kafka Consumer 까지 함께 띄운다(ADR 0066 — dual). HTTP 테스트는 그대로 돌고 Consumer 테스트가 같은 컨텍스트를 쓴다.
    # bootstrap 은 기반 클래스가 Testcontainers 로 넘긴다. 재시도 간격은 운영(1·5·30초)보다 짧게 둔다 — 횟수와 순서는 같다.
    ingest:
      mode: dual
    kafka:
      topic: pulsemetry-test-telemetry-ingress
      consumer-group: pulsemetry-test-telemetry-ingest
      consumer:
        retry-intervals: 100ms,200ms,300ms
        auth-exception-retry-interval: 1s
        shutdown-timeout: 10s

management:
  server:
    port: 0
  # main과 같은 trace 설정이다(ADR 0069). Boot 테스트는 @AutoConfigureTracing 없이는 export를 끈다.
  tracing:
    export:
      enabled: false
    propagation:
      consume: w3c
      produce: w3c
    baggage:
      enabled: false
  opentelemetry:
    map-environment-variables: false
  logging:
    export:
      otlp:
        enabled: false
  observations:
    enable:
      spring.security: false
  endpoints:
    web:
      exposure:
        include: prometheus
      discovery:
        enabled: false
  metrics:
    use-global-registry: false
    tags:
      application: ${spring.application.name}
      service: ingest
      environment: local

server:
  tomcat:
    mbeanregistry:
      enabled: true

logging:
  pattern:
    correlation: "%replace(trace_id=%X{traceId} span_id=%X{spanId} ){'^trace_id= span_id= $', ''}"
