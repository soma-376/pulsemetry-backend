spring:
  application:
    name: pulsemetry-retention-worker

  main:
    # 서버가 아니다 — 명령 하나를 실행하고 종료 코드로 끝난다 (ADR 0024 §5).
    web-application-type: none

  autoconfigure:
    # 분석 테이블 모듈이 보강 단계를 타고 :libs:enrollment-persistence 를 끌어와 JPA·Flyway starter 가 런타임 클래스패스에 오른다.
    # 이 앱은 DDL 을 실행하지 않고(telemetry_ops 는 enrollment-api, ClickHouse 는 ingest 가 적용한다) enrollment 를 읽지도 않는다 —
    # 켜 두면 Flyway 가 대상 DB 의 public 스키마에 이력 테이블을 만든다.
    exclude:
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration

  datasource:
    # 지우는 작업이라 로컬 기본값을 두지 않는다 — 비어 있으면 기동이 실패한다.
    url: ${PULSEMETRY_DB_URL:}
    username: ${PULSEMETRY_DB_USERNAME:}
    password: ${PULSEMETRY_DB_PASSWORD:}
    hikari:
      # 커넥션 획득 대기의 기본값은 30초다. 다른 앱과 같은 3초에서 끊는다.
      connection-timeout: 3000

# 기본값이 없는 값은 비어 있으면 기동이 실패한다. 대기 상한·반복 수는 운영 설정이다 — 보존 기간 수치는 여기가 아니라 명령의 인자다.
pulsemetry:
  retention:
    clickhouse:
      url: ${PULSEMETRY_CLICKHOUSE_URL:}
      database: ${PULSEMETRY_CLICKHOUSE_DATABASE:}
      # 응답 헤더까지의 대기. 동기 DELETE 는 mutation 이 끝난 뒤에 응답한다.
      timeout: ${PULSEMETRY_RETENTION_CLICKHOUSE_TIMEOUT:}
    drain:
      # fence 를 쓴 순간 실행 중이던 INSERT 를 기다리는 상한. 넘기면 완료하지 않고 incomplete 로 끝난다.
      timeout: ${PULSEMETRY_RETENTION_DRAIN_TIMEOUT:}
      poll-interval: ${PULSEMETRY_RETENTION_DRAIN_POLL_INTERVAL:}
    # drain → DELETE → 검증을 몇 번까지 되풀이하는가. 남은 행이 있으면 다음 회차다.
    max-passes: ${PULSEMETRY_RETENTION_MAX_PASSES:}
