server:
  # 8080(enrollment-api) · 4316(telemetry-ingest) 과 겹치지 않는 로컬 편의값이다 (ADR 0022 §1).
  port: ${PULSEMETRY_DASHBOARD_PORT:8081}
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  application:
    name: pulsemetry-dashboard-api
  autoconfigure:
    # Prometheus exemplar에 trace ID를 싣지 않는다(ADR 0069). 지표 노출 형식을 바꾸지 않는다.
    exclude: org.springframework.boot.micrometer.tracing.autoconfigure.prometheus.PrometheusExemplarsAutoConfiguration

  web:
    resources:
      # 정적 자원을 서빙하지 않는다. 매핑이 없는 경로는 컨트롤러 계층의 404 not_found 가 된다.
      add-mappings: false

  jpa:
    hibernate:
      # 스키마의 진실원은 Flyway 다. 이 앱은 읽기 전용 소비자이고, Hibernate 는 엔티티가
      # 스키마와 어긋나면 기동을 막는 역할만 한다.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: enrollment
    open-in-view: false

  flyway:
    # enrollment 스키마를 마이그레이션하는 주체는 :apps:enrollment-api 하나다 (ADR 0004 · 0022 §2).
    # spring-boot-starter-flyway 가 :libs:enrollment-persistence 를 타고 런타임 클래스패스에 오르므로 끈다 —
    # 켜 두면 읽기 전용 계정으로 마이그레이션을 시도한다.
    enabled: false

logging:
  pattern:
    # 요청 ID(X-Request-Id)를 로그 상관 키로 싣는다 — RequestIds.MDC_KEY 와 맞춘다.
    # 활성 span 안의 로그에만 trace_id·span_id를 이어 붙인다(ADR 0069·0079). span이 없으면 두 필드를 지운다.
    correlation: "[%X{requestId:-}] %replace(trace_id=%X{traceId} span_id=%X{spanId} ){'^trace_id= span_id= $', ''}"

# 운영 계측은 공개 HTTP 서버와 분리한다(ADR 0068·0079). 네트워크 접근은 infra가 제한한다.
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9404}
  # 플랫폼 trace(ADR 0069·0079). 기본은 끔이다. 켜면 OTLP/HTTP(`/v1/traces`까지 쓴 전체 URL)로 Collector에 보낸다.
  # 전송은 비동기 batch이고 queue가 차거나 Collector가 죽으면 span을 버린다 — 응답은 기다리지 않는다.
  tracing:
    export:
      enabled: ${PULSEMETRY_TRACING_ENABLED:false}
    sampling:
      probability: ${PULSEMETRY_TRACING_SAMPLE_PROBABILITY:0.1}
    # W3C traceparent만 쓴다. 공개 요청의 trace header는 TracingConfig가 지운다.
    propagation:
      consume: w3c
      produce: w3c
    baggage:
      enabled: false
  opentelemetry:
    # OTEL_* 환경변수가 설정을 바꾸지 않게 한다. 출처는 위 PULSEMETRY_TRACING_* 하나다.
    map-environment-variables: false
    tracing:
      export:
        max-queue-size: 2048
        timeout: 10s
        otlp:
          endpoint: ${PULSEMETRY_TRACING_OTLP_TRACES_ENDPOINT:}
          timeout: 10s
  # 로그는 stdout → Fluent Bit 경로를 유지한다. OTLP 로그 내보내기를 켜지 않는다.
  logging:
    export:
      otlp:
        enabled: false
  observations:
    enable:
      # Security filter chain의 내부 span·지표는 쓰지 않는다. 업무 요청 span 하나에 하위 span이 줄줄이 붙는다.
      spring.security: false
  endpoints:
    web:
      exposure:
        include: prometheus
      discovery:
        enabled: false
  metrics:
    use-global-registry: false
    tags:
      application: ${spring.application.name}
      service: dashboard
      environment: ${PULSEMETRY_OBSERVABILITY_ENVIRONMENT:local}
    distribution:
      # route별 p95와 수 초 단위 조회(개요 1년 등)를 함께 덮는 고정 버킷이다. 버킷 수를 고정해 series를 묶는다(ADR 0079).
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2500ms,5s,10s

# 기본값이 없는 값은 비어 있으면 기동이 실패한다 (ADR 0022 §4·§5). 계정·상한은 infra 가 정한다.
pulsemetry:
  # 플랫폼 trace resource 값(ADR 0069·0079). 비어 있으면 그 속성을 넣지 않는다. namespace·pod는 Downward API가 준다.
  tracing:
    environment: ${PULSEMETRY_OBSERVABILITY_ENVIRONMENT:local}
    cluster: ${PULSEMETRY_TRACING_CLUSTER:}
    namespace: ${POD_NAMESPACE:}
    pod: ${POD_NAME:}
  user-auth:
    enabled: ${PULSEMETRY_USER_AUTH_ENABLED:false}
    issuer: ${PULSEMETRY_USER_AUTH_ISSUER:}
    audience: ${PULSEMETRY_USER_AUTH_AUDIENCE:}
    public-key-files:
      local: ${PULSEMETRY_USER_AUTH_PUBLIC_KEY_FILE:}
    allowed-origins: ${PULSEMETRY_USER_AUTH_ALLOWED_ORIGINS:}
  management:
    enabled: ${PULSEMETRY_MANAGEMENT_ENABLED:false}
  # 메일 발송은 enrollment-api 가 한다. 이 값은 "설치 업데이트 안내를 보낼 수 있는가"의 표시에만 쓴다(ADR 0043) — enrollment-api 와 같은 값을 준다.
  mail:
    enabled: ${PULSEMETRY_MAIL_ENABLED:false}
  dashboard:
    # 503 응답의 Retry-After.
    retry-after: ${PULSEMETRY_DASHBOARD_RETRY_AFTER:}

    clickhouse:
      # 분석 테이블·ledger 읽기 — SELECT 만 가진 계정. 계정 프로필은 readonly=2 이하여야 한다
      # (요청마다 readonly=2 와 상한 설정을 싣는다 — readonly=1 프로필은 설정 변경을 거부한다).
      source:
        url: ${PULSEMETRY_DASHBOARD_CLICKHOUSE_SOURCE_URL:}
        database: ${PULSEMETRY_DASHBOARD_CLICKHOUSE_SOURCE_DATABASE:}
        username: ${PULSEMETRY_DASHBOARD_CLICKHOUSE_SOURCE_USERNAME:}
        password: ${PULSEMETRY_DASHBOARD_CLICKHOUSE_SOURCE_PASSWORD:}
        query-timeout: ${PULSEMETRY_DASHBOARD_CLICKHOUSE_SOURCE_QUERY_TIMEOUT:}
        max-result-rows: ${PULSEMETRY_DASHBOARD_CLICKHOUSE_SOURCE_MAX_RESULT_ROWS:}
        max-result-bytes: ${PULSEMETRY_DASHBOARD_CLICKHOUSE_SOURCE_MAX_RESULT_BYTES:}

      # dashboard_cache 쓰기·읽기 + snapshot 복사의 원본(분석 테이블) SELECT. 기동 때 이 계정으로 dashboard_cache 의
      # 테이블·뷰를 만든다 — DB 자체는 infra 가 만든다 (ADR 0023 §3).
      cache:
        url: ${PULSEMETRY_DASHBOARD_CLICKHOUSE_CACHE_URL:}
        database: ${PULSEMETRY_DASHBOARD_CLICKHOUSE_CACHE_DATABASE:}
        username: ${PULSEMETRY_DASHBOARD_CLICKHOUSE_CACHE_USERNAME:}
        password: ${PULSEMETRY_DASHBOARD_CLICKHOUSE_CACHE_PASSWORD:}
        query-timeout: ${PULSEMETRY_DASHBOARD_CLICKHOUSE_CACHE_QUERY_TIMEOUT:}

    rds:
      # enrollment · telemetry_ops 읽기 — SELECT 만 가진 계정.
      source:
        url: ${PULSEMETRY_DASHBOARD_RDS_SOURCE_URL:}
        username: ${PULSEMETRY_DASHBOARD_RDS_SOURCE_USERNAME:}
        password: ${PULSEMETRY_DASHBOARD_RDS_SOURCE_PASSWORD:}
        # enrollment-api · telemetry-ingest 의 connection-timeout(3000ms) 과 같은 값이다.
        connection-timeout: 3s

      # dashboard_cache 스키마 — 기동 때 이 계정으로 Flyway 를 돌린다. 공개 CAS 를 위해 telemetry_ops.tenant_retention_boundary 를
      # SELECT 한다 (ADR 0023 §3).
      cache:
        url: ${PULSEMETRY_DASHBOARD_RDS_CACHE_URL:}
        username: ${PULSEMETRY_DASHBOARD_RDS_CACHE_USERNAME:}
        password: ${PULSEMETRY_DASHBOARD_RDS_CACHE_PASSWORD:}
        connection-timeout: 3s

    # snapshot 수명의 운영 수치 (ADR 0023 §1). 물리 정리 시각 = build 시작 + build-timeout + 10분 + purge-grace.
    # 한도(동시 build·복사 행·바이트·시간)를 넘으면 부분 결과를 공개하지 않고 503 이다. 값은 대표 규모의 측정으로 정한다.
    # 복사 행·바이트의 0 은 그 상한을 걸지 않는다는 뜻이다(ADR 0080). 비어 있으면 기동이 실패한다.
    snapshot:
      build-timeout: ${PULSEMETRY_DASHBOARD_SNAPSHOT_BUILD_TIMEOUT:}
      purge-grace: ${PULSEMETRY_DASHBOARD_SNAPSHOT_PURGE_GRACE:}
      max-concurrent-builds: ${PULSEMETRY_DASHBOARD_SNAPSHOT_MAX_CONCURRENT_BUILDS:}
      max-copy-rows: ${PULSEMETRY_DASHBOARD_SNAPSHOT_MAX_COPY_ROWS:}
      max-copy-bytes: ${PULSEMETRY_DASHBOARD_SNAPSHOT_MAX_COPY_BYTES:}
      cleanup-interval: ${PULSEMETRY_DASHBOARD_SNAPSHOT_CLEANUP_INTERVAL:}

    # 구성원 화면의 정책 값 — 저장된 조직 정책이 없어 설정으로 받는다. 7·14·30·60 중 하나, 기본값 없음.
    members:
      idle-days: ${PULSEMETRY_DASHBOARD_MEMBERS_IDLE_DAYS:}

    # 수집 상태 판정의 운영 수치 (ADR 0041). 기본값 없음.
    # window 는 설치 보고 주기(enrollment-api 의 pulsemetry.heartbeat.report-interval)보다 길어야 한다 — 짧으면 살아 있는 설치가 보고 사이에 빠진다.
    ingest:
      window: ${PULSEMETRY_DASHBOARD_INGEST_WINDOW:}
      delayed-after: ${PULSEMETRY_DASHBOARD_INGEST_DELAYED_AFTER:}
      down-after: ${PULSEMETRY_DASHBOARD_INGEST_DOWN_AFTER:}

    # 기간 완전성 판정의 운영 수치 (ADR 0042). 기본값 없음.
    # settle-after: 하루가 끝난 뒤 그날을 확정하기까지 기다리는 시간 — 데몬의 전송(재시도 포함)·서버 적재가 끝나는 시간보다 길게.
    completeness:
      settle-after: ${PULSEMETRY_DASHBOARD_COMPLETENESS_SETTLE_AFTER:}

    # 좌석 원장 조회의 운영 수치 (ADR 0048 §7). 기본값 없음.
    # stale-after: 연결의 마지막 성공 동기화가 이보다 오래되면 그 제품의 좌석을 낡았다고 표시한다 — enrollment-api 의 동기화 간격보다 길게.
    seats:
      stale-after: ${PULSEMETRY_DASHBOARD_SEATS_STALE_AFTER:}

    # 알림 평가의 운영 수치 (ADR 0051 §5). 기본값 없음.
    # evaluation-interval: 켜진 규칙을 평가하는 주기. lease: 한 조직의 평가 선점 기한 — 한 회차보다 길게.
    alerts:
      evaluation-interval: ${PULSEMETRY_DASHBOARD_ALERTS_EVALUATION_INTERVAL:}
      lease: ${PULSEMETRY_DASHBOARD_ALERTS_LEASE:}
