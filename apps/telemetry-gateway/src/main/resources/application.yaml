server:
  # 8082 — enrollment(8080)·dashboard(8081)·ingest(4316)와 겹치지 않고, 데몬 로컬 수신기의 4318 도 피한다 (ADR 0066).
  port: ${PULSEMETRY_GATEWAY_PORT:8082}
  # SIGTERM 에 새 접수를 멈추고 진행 중 요청을 끝낸다. 요청 하나는 기한(7.5초) 안에 끝나므로 30초면 남는다.
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true
    threads:
      # 동시 처리 상한. 요청 하나가 본문(최대 10 MiB)과 envelope 사본을 함께 쥐므로 메모리 예산이 이 값에 비례한다
      # (docs/telemetry-kafka-operations.md — 메모리 산정). 넘친 연결은 accept 대기열에서 기다린다.
      max: 16

spring:
  application:
    name: pulsemetry-telemetry-gateway
  autoconfigure:
    # Prometheus exemplar에 trace ID를 싣지 않는다(ADR 0069). 지표 노출 형식을 바꾸지 않는다.
    exclude: org.springframework.boot.micrometer.tracing.autoconfigure.prometheus.PrometheusExemplarsAutoConfiguration
  lifecycle:
    # graceful 종료의 상한. Pod 종료 유예(60초) 안에 producer 정리(최대 10초)까지 끝난다.
    timeout-per-shutdown-phase: 30s

pulsemetry:
  # 업무 계측 on/off (ADR 0068). false 면 pulsemetry_* 지표만 끈다 — JVM·Kafka client 지표와 scrape 는 그대로다.
  observability:
    enabled: ${PULSEMETRY_OBSERVABILITY_ENABLED:true}

  # 플랫폼 trace resource 값(ADR 0069). 비어 있으면 그 속성을 넣지 않는다. namespace·pod는 Downward API가 준다.
  tracing:
    environment: ${PULSEMETRY_OBSERVABILITY_ENVIRONMENT:local}
    cluster: ${PULSEMETRY_TRACING_CLUSTER:}
    namespace: ${POD_NAMESPACE:}
    pod: ${POD_NAME:}

  # telemetry JWT 공개키 (ADR 0065) — pulsemetry.telemetry-jwt.public-key-files. kid → X.509 PEM 경로 맵이고 **필수다**
  # (비어 있으면 기동하지 않는다). 환경변수 이름은 kid 의 대소문자를 잃으므로 배포는 SPRING_APPLICATION_JSON 으로 넣는다:
  #   {"pulsemetry":{"telemetry-jwt":{"public-key-files":{"<kid>":"/mnt/telemetry-jwt/keys/<alias>"}}}}

  telemetry:
    kafka:
      bootstrap-servers: ${PULSEMETRY_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      # plaintext(로컬), iam(MSK), mtls(Strimzi). mtls는 읽기 전용 PKCS12 파일을 쓴다(ADR 0070).
      security: ${PULSEMETRY_KAFKA_SECURITY:plaintext}
      topic: ${PULSEMETRY_KAFKA_TOPIC:pulsemetry-local-telemetry-ingress}
      tls:
        truststore-location: ${PULSEMETRY_KAFKA_TLS_TRUSTSTORE_LOCATION:}
        truststore-password-file: ${PULSEMETRY_KAFKA_TLS_TRUSTSTORE_PASSWORD_FILE:}
        keystore-location: ${PULSEMETRY_KAFKA_TLS_KEYSTORE_LOCATION:}
        keystore-password-file: ${PULSEMETRY_KAFKA_TLS_KEYSTORE_PASSWORD_FILE:}
      iam:
        # workload 전용 MSK 역할. Pod Identity 자격으로 고정 세션 이름을 써서 assume 한다 (ADR 0066 Decision 9).
        role-arn: ${PULSEMETRY_KAFKA_IAM_ROLE_ARN:}
        session-name: ${PULSEMETRY_KAFKA_IAM_SESSION_NAME:}

# 운영 계측은 공개 HTTP 서버와 분리한다(ADR 0068). 네트워크 접근은 infra가 제한한다.
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9404}
  # 플랫폼 trace(ADR 0069). 기본은 끔이다. 켜면 OTLP/HTTP(`/v1/traces`까지 쓴 전체 URL)로 Collector에 보낸다.
  # 전송은 비동기 batch이고 queue가 차거나 Collector가 죽으면 span을 버린다 — 업무 응답·ack·commit은 기다리지 않는다.
  tracing:
    export:
      enabled: ${PULSEMETRY_TRACING_ENABLED:false}
    sampling:
      # parent-based. 합성·소량 E2E 기간에만 1.0으로 올린다.
      probability: ${PULSEMETRY_TRACING_SAMPLE_PROBABILITY:0.1}
    # W3C traceparent만 주고받는다. baggage·B3는 쓰지 않는다.
    propagation:
      consume: w3c
      produce: w3c
    baggage:
      enabled: false
  opentelemetry:
    # OTEL_* 환경변수가 설정을 바꾸지 않게 한다. 출처는 위 PULSEMETRY_TRACING_* 하나다.
    map-environment-variables: false
    tracing:
      export:
        max-queue-size: 2048
        timeout: 10s
        otlp:
          endpoint: ${PULSEMETRY_TRACING_OTLP_TRACES_ENDPOINT:}
          timeout: 10s
  # 로그는 stdout → Fluent Bit 경로를 유지한다. OTLP 로그 내보내기를 켜지 않는다.
  logging:
    export:
      otlp:
        enabled: false
  endpoints:
    web:
      exposure:
        include: prometheus
      discovery:
        enabled: false
  metrics:
    use-global-registry: false
    tags:
      application: ${spring.application.name}
      service: gateway
      environment: ${PULSEMETRY_OBSERVABILITY_ENVIRONMENT:local}

# 활성 span 안의 로그에만 trace_id·span_id를 붙인다(ADR 0069). span이 없으면 두 필드를 지운다.
# 평문 형식과 event=<code>는 그대로다.
logging:
  pattern:
    correlation: "%replace(trace_id=%X{traceId} span_id=%X{spanId} ){'^trace_id= span_id= $', ''}"
