spring:
  application:
    name: pulsemetry

  jackson:
    deserialization:
      # 계약에 없는 필드가 오면 400 invalid_request 다 (PLAN.md §6.2).
      # 관대하게 받으면 클라이언트의 오타를 조용히 삼켜 디버깅이 불가능해진다.
      fail-on-unknown-properties: true

  datasource:
    # 로컬 기본값은 docker-compose.yml 의 postgres 서비스를 가리킨다.
    # 운영에서는 환경변수로 덮어쓴다.
    url: ${PULSEMETRY_DB_URL:jdbc:postgresql://localhost:5432/pulsemetry}
    username: ${PULSEMETRY_DB_USERNAME:pulsemetry}
    password: ${PULSEMETRY_DB_PASSWORD:pulsemetry}

  jpa:
    hibernate:
      # 스키마의 진실원은 Flyway 다. Hibernate 는 엔티티가 스키마와 어긋나면 기동을 막는 역할만 한다 (L4).
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: enrollment
    # 뷰 렌더링 중 지연 로딩을 허용하지 않는다. 트랜잭션 경계는 서비스가 갖는다.
    open-in-view: false

  flyway:
    enabled: true
    # 마이그레이션 SQL 은 libs/enrollment-persistence 의 리소스에 있다.
    locations: classpath:db/migration
    # enrollment 스키마를 Flyway 가 만들고 flyway_schema_history 도 그 안에 둔다.
    schemas: enrollment
    default-schema: enrollment
