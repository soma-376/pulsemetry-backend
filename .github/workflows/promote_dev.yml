name: Promote Dev Image Bundle

on:
  workflow_run:
    workflows: [Publish Dev Images]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      run_id:
        description: '원본 생산 run ID. 비우면 최신 성공 후보를 다시 평가한다.'
        required: false
        type: string
      run_attempt:
        description: '원본 생산 attempt. run_id와 함께 지정한다.'
        required: false
        type: string
  schedule:
    # 다른 publisher의 잠금 때문에 보류된 완료 후보를 다시 평가한다. 만료 잠금은 탈취하지 않는다.
    - cron: '17,47 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-dev-gitops
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      vars.DEV_GITOPS_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: dev-gitops
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      DELIVERY_ENABLED: ${{ vars.DEV_GITOPS_ENABLED }}
      GH_TOKEN: ${{ github.token }}
      AWS_REGION: ap-northeast-2
    steps:
      # producer head/artifact가 아닌 이 privileged workflow의 검토된 source를 실행한다.
      - name: Checkout trusted promotion code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate execution and tooling lock
        id: tooling
        run: python3 scripts/gitops/promote.py --preflight

      - name: Fetch current producer history
        run: git fetch --no-tags origin +refs/heads/develop:refs/remotes/origin/develop

      - name: Checkout pinned infra tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: soma-376/infra
          ref: ${{ steps.tooling.outputs.revision }}
          path: .gitops-infra
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install locked tooling dependencies
        run: npm ci --ignore-scripts --prefix .gitops-infra

      - name: Install PostgreSQL read client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends postgresql-client
          psql --version

      - name: Set up Docker Buildx for immutable manifest inspection
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Install pinned Session Manager plugin
        run: |
          mkdir -p "$RUNNER_TEMP/session-manager-plugin"
          cd "$RUNNER_TEMP/session-manager-plugin"
          curl --fail --silent --show-error --location --retry 3 https://s3.amazonaws.com/session-manager-downloads/plugin/1.2.896.0/ubuntu_64bit/session-manager-plugin.deb -o plugin.deb
          echo '53f51fcc67314a4bf85888a38a3967cd41f8d0f28a60a9469a63acf935ba713e  plugin.deb' | sha256sum --check
          sudo dpkg -i plugin.deb
          test "$(session-manager-plugin --version)" = '1.2.896.0'

      - name: Assume promotion read role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.GITOPS_PROMOTION_ROLE_ARN_DEV }}
          aws-region: ap-northeast-2
          role-session-name: backend-gitops-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Verify immutable candidate and packaged contracts
        run: python3 scripts/gitops/promote.py --infra .gitops-infra --prepare

      - name: Create private publisher installation token
        id: publisher
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GITOPS_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.GITOPS_PUBLISHER_PRIVATE_KEY }}
          owner: soma-376
          repositories: infra-generated-values
          permission-contents: write

      - name: Verify source and promote with shared CAS
        env:
          VALUES_GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: python3 scripts/gitops/promote.py --infra .gitops-infra
