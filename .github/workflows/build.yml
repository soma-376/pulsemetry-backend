name: build

on:
  push:
    branches: ['**']
  pull_request:

# 읽기 전용 워크플로다 — 빌드와 아티팩트 업로드뿐이라 컨텐츠 읽기 권한이면 충분하다.
permissions:
  contents: read

jobs:
  build:
    name: Gradle build (Testcontainers)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          # 이후 단계는 git 자격증명이 필요 없다 — 워크스페이스에 토큰을 남기지 않는다.
          persist-credentials: false

      # 계약 테스트는 telemetryctl 의 스키마 파일 원본을 읽는다.
      # 복사본을 backend 에 두면 언젠가 원본과 갈라지고, 그때 통과하는 건 계약이 아니게 된다.
      - name: Checkout telemetryctl (계약 원천)
        uses: actions/checkout@v4
        with:
          repository: soma-376/telemetryctl
          path: telemetryctl
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 통합 테스트는 실제 PostgreSQL 로만 돈다 (Testcontainers).
      # ubuntu-latest 러너에는 Docker 데몬이 이미 떠 있다. H2 등으로 대체하지 않는다.
      - name: Build
        run: ./gradlew build --no-daemon
        env:
          PULSEMETRY_CONTRACTS_DIR: ${{ github.workspace }}/telemetryctl/contracts

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          retention-days: 7
