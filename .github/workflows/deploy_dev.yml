name: Publish Dev Images

on:
  push:
    branches: [develop]
  workflow_dispatch:

# dev 태그 갱신이 겹치지 않도록 이미지 게시를 직렬화한다.
# 진행 중인 게시가 일부 앱의 태그만 갱신한 채 취소되지 않도록 cancel-in-progress는 false다.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

# 기본은 읽기만 허용한다. OIDC 토큰 발급 권한은 deploy 잡에만 준다.
permissions:
  contents: read

env:
  # AWS_REGION은 공통 이름을 쓰고, 나머지는 _DEV 접미사가 붙은 GitHub Actions Secrets를 쓴다.
  AWS_REGION: ${{ secrets.AWS_REGION }}

  # 기존 이미지 소비자와의 호환을 위해 dev 태그를 유지한다.
  # EKS 수동 배포는 이 가변 태그 대신 확인한 이미지 digest를 사용한다.
  IMAGE_TAG: ${{ secrets.IMAGE_TAG_DEV }}
  ECR_REPO_ENROLLMENT_API: ${{ secrets.ECR_REPO_ENROLLMENT_API_DEV }}
  ECR_REPO_TELEMETRY_INGEST: ${{ secrets.ECR_REPO_TELEMETRY_INGEST_DEV }}
  ECR_REPO_DASHBOARD_API: ${{ secrets.ECR_REPO_DASHBOARD_API_DEV }}

  AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN_DEV }}

jobs:
  validate:
    name: Gradle build (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Test dev image publication
        run: python3 .github/tests/test_deploy_dev.py

      # 계약 테스트는 telemetryctl의 스키마 파일 원본을 읽는다.
      # 복사본을 backend에 두면 원본과 갈라질 수 있으므로 직접 체크아웃한다.
      - name: Checkout telemetryctl (계약 원천)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: soma-376/telemetryctl
          path: telemetryctl
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # 통합 테스트는 Testcontainers로 실제 PostgreSQL을 띄운다.
      - name: Build
        run: ./gradlew build --no-daemon
        env:
          PULSEMETRY_CONTRACTS_DIR: ${{ github.workspace }}/telemetryctl/contracts

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          retention-days: 7

  deploy:
    name: Build and publish images to ECR
    needs: validate
    # dev EKS 노드가 ARM64이므로 linux/arm64 이미지를 네이티브 ARM 러너에서 만든다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    permissions:
      id-token: write
      contents: read
    steps:
      # 미등록 GitHub Secret은 빈 문자열이 된다. 실제 값은 노출하지 않고 이름만 보고한다.
      - name: Verify required GitHub Secrets
        run: |
          missing=()
          for mapping in \
            AWS_REGION:AWS_REGION \
            IMAGE_TAG:IMAGE_TAG_DEV \
            ECR_REPO_ENROLLMENT_API:ECR_REPO_ENROLLMENT_API_DEV \
            ECR_REPO_TELEMETRY_INGEST:ECR_REPO_TELEMETRY_INGEST_DEV \
            ECR_REPO_DASHBOARD_API:ECR_REPO_DASHBOARD_API_DEV \
            AWS_DEPLOY_ROLE_ARN:AWS_DEPLOY_ROLE_ARN_DEV; do
            env_name="${mapping%%:*}"
            secret_name="${mapping#*:}"
            if [[ -z "${!env_name}" ]]; then
              missing+=("$secret_name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf '::error::필수 GitHub Secret이 등록되지 않았거나 비어 있다: %s\n' "${missing[*]}"
            exit 1
          fi

          if [[ "$IMAGE_TAG" != dev ]]; then
            echo '::error::IMAGE_TAG_DEV는 호환용 이미지 태그인 dev여야 한다.'
            exit 1
          fi

          if [[ "$ECR_REPO_ENROLLMENT_API" == "$ECR_REPO_TELEMETRY_INGEST" \
             || "$ECR_REPO_ENROLLMENT_API" == "$ECR_REPO_DASHBOARD_API" \
             || "$ECR_REPO_TELEMETRY_INGEST" == "$ECR_REPO_DASHBOARD_API" ]]; then
            echo '::error::세 앱의 ECR 저장소는 각각 달라야 한다.'
            exit 1
          fi

          echo "이미지 게시 설정 확인 완료"

      - name: Checkout backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Checkout telemetryctl (이미지 계약 원천)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: soma-376/telemetryctl
          path: telemetryctl
          persist-credentials: false

      # 장기 액세스 키를 쓰지 않는다(인프라 ADR-0024). 신뢰 정책이 develop ref를
      # StringEquals로 고정하므로 이 잡에 environment를 붙이지 않는다.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # registry 출력으로 URI를 얻어 계정 ID를 워크플로우에 기록하지 않는다.
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Dockerfile과 빌드 컨텍스트는 레포 루트다. 이미지 게시 역할에 ECR pull 권한이 없으므로
      # registry cache 대신 GitHub Actions cache만 쓴다.
      # 세 SHA 이미지가 모두 게시되기 전에는 호환용 dev 태그를 갱신하지 않는다.
      - name: Build and push enrollment-api
        id: build-enrollment
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          target: enrollment-api
          build-contexts: |
            telemetry-contracts=./telemetryctl/contracts
          platforms: linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_ENROLLMENT_API }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=enrollment-api
          cache-to: type=gha,mode=max,scope=enrollment-api

      - name: Build and push telemetry-ingest
        id: build-ingest
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          target: telemetry-ingest
          platforms: linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_TELEMETRY_INGEST }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=telemetry-ingest
          cache-to: type=gha,mode=max,scope=telemetry-ingest

      - name: Build and push dashboard-api
        id: build-dashboard
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          target: dashboard-api
          platforms: linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_DASHBOARD_API }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=dashboard-api
          cache-to: type=gha,mode=max,scope=dashboard-api

      # 이번 빌드의 digest로 세 앱의 dev 태그를 순서대로 갱신한다.
      # 실패하면 이후 승격은 중단하고 앞서 갱신한 태그는 유지한다. EKS 배포는 운영자가 별도로 수행한다.
      - name: Promote dev image tags
        env:
          ENROLLMENT_IMAGE_DIGEST: ${{ steps.build-enrollment.outputs.digest }}
          INGEST_IMAGE_DIGEST: ${{ steps.build-ingest.outputs.digest }}
          DASHBOARD_IMAGE_DIGEST: ${{ steps.build-dashboard.outputs.digest }}
        run: |
          promote_image() {
            local repository="$1" digest="$2" image manifest media_type current_digest
            # SHA 태그가 재실행으로 이동해도 이번 빌드가 게시한 정확한 이미지를 선택한다.
            image=$(aws ecr batch-get-image --repository-name "$repository" \
              --image-ids "imageDigest=$digest" --no-cli-pager --output json)
            # 같은 digest에 SHA·dev 태그가 붙으면 여러 항목이 반환될 수 있다.
            # 태그 개수가 아니라 요청한 digest의 manifest·media type이 유일한지 확인한다.
            image=$(jq -ec --arg digest "$digest" '
              if (.failures | length) != 0 then
                error("게시된 이미지 조회에 실패했다")
              else
                [.images[] | select(.imageId.imageDigest == $digest) |
                  {imageManifest, imageManifestMediaType}] | unique |
                if length == 1 then .[0]
                else error("게시된 이미지 manifest를 유일하게 확인할 수 없다") end
              end
              ' <<< "$image")
            manifest=$(jq -er '.imageManifest | select(type == "string" and length > 0)' <<< "$image")
            media_type=$(jq -er '.imageManifestMediaType | select(type == "string" and length > 0)' <<< "$image")

            # 같은 이미지로 재실행하면 PutImage의 ImageAlreadyExistsException을 피한다.
            current_digest=$(aws ecr batch-get-image --repository-name "$repository" \
              --image-ids "imageTag=$IMAGE_TAG" --no-cli-pager \
              --query 'images[0].imageId.imageDigest' --output text)
            if [[ "$current_digest" == "$digest" ]]; then
              echo "이미지 태그 유지: $repository:$IMAGE_TAG ($digest)"
              return
            fi

            # 레이어를 다시 내려받지 않고 manifest만 재사용한다.
            aws ecr put-image --repository-name "$repository" --image-tag "$IMAGE_TAG" \
              --image-manifest "$manifest" --image-manifest-media-type "$media_type" \
              --image-digest "$digest" --no-cli-pager \
              --query 'image.imageId.imageDigest' --output text
          }

          promote_image "$ECR_REPO_ENROLLMENT_API" "$ENROLLMENT_IMAGE_DIGEST"
          promote_image "$ECR_REPO_TELEMETRY_INGEST" "$INGEST_IMAGE_DIGEST"

          promote_image "$ECR_REPO_DASHBOARD_API" "$DASHBOARD_IMAGE_DIGEST"
