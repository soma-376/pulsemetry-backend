name: Deploy to Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

# 배포는 겹치면 안 된다. 진행 중인 배포를 취소하면 ECS가 어중간한 상태로 남을 수 있으므로
# cancel-in-progress는 false다. 뒤 커밋의 배포는 앞 배포가 끝난 뒤에 돈다.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

# 기본은 읽기만 허용한다. OIDC 토큰 발급 권한은 deploy 잡에만 준다.
permissions:
  contents: read

env:
  # AWS_REGION은 공통 이름을 쓰고, 나머지는 _DEV 접미사가 붙은 GitHub Actions Secrets를 쓴다.
  AWS_REGION: ${{ secrets.AWS_REGION }}

  # infra의 DEV_DEFAULT_IMAGE_TAG와 반드시 일치해야 한다.
  # 태스크 정의가 이 가변 태그를 가리키고, 강제 재배포가 같은 태그를 다시 당겨온다.
  IMAGE_TAG: ${{ secrets.IMAGE_TAG_DEV }}
  ECR_REPO_ENROLLMENT_API: ${{ secrets.ECR_REPO_ENROLLMENT_API_DEV }}
  ECR_REPO_TELEMETRY_INGEST: ${{ secrets.ECR_REPO_TELEMETRY_INGEST_DEV }}

  AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN_DEV }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_DEV }}
  ECS_SERVICE_ENROLLMENT_API: ${{ secrets.ECS_SERVICE_ENROLLMENT_API_DEV }}
  ECS_SERVICE_TELEMETRY_INGEST: ${{ secrets.ECS_SERVICE_TELEMETRY_INGEST_DEV }}

jobs:
  validate:
    name: Gradle build (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # 계약 테스트는 telemetryctl의 스키마 파일 원본을 읽는다.
      # 복사본을 backend에 두면 원본과 갈라질 수 있으므로 직접 체크아웃한다.
      - name: Checkout telemetryctl (계약 원천)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: soma-376/telemetryctl
          path: telemetryctl
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # 통합 테스트는 Testcontainers로 실제 PostgreSQL을 띄운다.
      - name: Build
        run: ./gradlew build --no-daemon
        env:
          PULSEMETRY_CONTRACTS_DIR: ${{ github.workspace }}/telemetryctl/contracts

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          retention-days: 7

  deploy:
    name: Build, push to ECR and force-deploy ECS
    needs: validate
    # dev 앱 호스트가 Graviton이므로 linux/arm64 이미지를 네이티브 ARM 러너에서 만든다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    permissions:
      id-token: write
      contents: read
    steps:
      # 미등록 GitHub Secret은 빈 문자열이 된다. 실제 값은 노출하지 않고 이름만 보고한다.
      - name: Verify required GitHub Secrets
        run: |
          missing=()
          for mapping in \
            AWS_REGION:AWS_REGION \
            IMAGE_TAG:IMAGE_TAG_DEV \
            ECR_REPO_ENROLLMENT_API:ECR_REPO_ENROLLMENT_API_DEV \
            ECR_REPO_TELEMETRY_INGEST:ECR_REPO_TELEMETRY_INGEST_DEV \
            AWS_DEPLOY_ROLE_ARN:AWS_DEPLOY_ROLE_ARN_DEV \
            ECS_CLUSTER:ECS_CLUSTER_DEV \
            ECS_SERVICE_ENROLLMENT_API:ECS_SERVICE_ENROLLMENT_API_DEV \
            ECS_SERVICE_TELEMETRY_INGEST:ECS_SERVICE_TELEMETRY_INGEST_DEV; do
            env_name="${mapping%%:*}"
            secret_name="${mapping#*:}"
            if [[ -z "${!env_name}" ]]; then
              missing+=("$secret_name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf '::error::필수 GitHub Secret이 등록되지 않았거나 비어 있다: %s\n' "${missing[*]}"
            exit 1
          fi

          if [[ "$IMAGE_TAG" != dev ]]; then
            echo '::error::IMAGE_TAG_DEV는 infra의 기본 이미지 태그인 dev여야 한다.'
            exit 1
          fi

          if [[ "$ECS_SERVICE_ENROLLMENT_API" == "$ECS_SERVICE_TELEMETRY_INGEST" \
             || "$ECR_REPO_ENROLLMENT_API" == "$ECR_REPO_TELEMETRY_INGEST" ]]; then
            echo '::error::두 앱의 ECR 저장소와 ECS 서비스는 각각 달라야 한다.'
            exit 1
          fi

          echo "배포 설정 확인 완료"

      - name: Checkout backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # 장기 액세스 키를 쓰지 않는다(인프라 ADR-0024). 신뢰 정책이 develop ref를
      # StringEquals로 고정하므로 이 잡에 environment를 붙이지 않는다.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 최초 ECR 이미지 공급과 ECS 서비스 생성은 운영 선행 작업이다(infra ADR-0026).
      # 둘 다 준비되기 전에는 가변 이미지 태그를 덮어쓰거나 일부 서비스만 재배포하지 않는다.
      - name: Verify both ECS services are active
        run: |
          services=$(aws ecs describe-services --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE_ENROLLMENT_API" "$ECS_SERVICE_TELEMETRY_INGEST" \
            --no-cli-pager --output json)

          if ! jq -e \
            --arg enrollment "$ECS_SERVICE_ENROLLMENT_API" \
            --arg ingest "$ECS_SERVICE_TELEMETRY_INGEST" '
              (.failures | length) == 0 and
              ([.services[].serviceName] | sort) == ([$enrollment, $ingest] | sort) and
              all(.services[]; .status == "ACTIVE" and .desiredCount > 0)
            ' <<< "$services" > /dev/null; then
            echo '::error::두 ECS 서비스가 모두 ACTIVE이고 desiredCount가 1 이상이어야 한다. infra 선행 배포를 확인한다.'
            exit 1
          fi

      # registry 출력으로 URI를 얻어 계정 ID를 워크플로우에 기록하지 않는다.
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Dockerfile과 빌드 컨텍스트는 레포 루트다. 배포 역할에 ECR pull 권한이 없으므로
      # registry cache 대신 GitHub Actions cache만 쓴다.
      - name: Build and push enrollment-api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          target: enrollment-api
          platforms: linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_ENROLLMENT_API }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_ENROLLMENT_API }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=enrollment-api
          cache-to: type=gha,mode=max,scope=enrollment-api

      - name: Build and push telemetry-ingest
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          target: telemetry-ingest
          platforms: linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_TELEMETRY_INGEST }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_TELEMETRY_INGEST }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=telemetry-ingest
          cache-to: type=gha,mode=max,scope=telemetry-ingest

      # 태스크 정의는 CDK가 소유한다. 기존 리비전을 그대로 쓰고 가변 태그를 다시 당긴다.
      # Flyway를 적용하는 enrollment-api가 먼저 안정화돼야 ingest의 JPA 검증이 성립한다.
      # 두 서비스 모두 minHealthyPercent가 0이므로 교체 중 짧은 다운타임이 정상이다.
      - name: Deploy enrollment-api, then telemetry-ingest
        run: |
          deploy_service() {
            local service="$1" deployment_id state
            echo "::group::재배포 및 안정화: $service"
            deployment_id=$(aws ecs update-service --cluster "$ECS_CLUSTER" --service "$service" \
              --force-new-deployment --no-cli-pager \
              --query "service.deployments[?status=='PRIMARY'].id | [0]" --output text)

            if [[ -z "$deployment_id" || "$deployment_id" == None ]]; then
              echo "::error::새 deployment ID를 확인할 수 없다: $service"
              exit 1
            fi

            aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$service"

            # waiter는 이전 배포로 롤백돼도 성공할 수 있다. 방금 요청한 배포의 완료를 확인한다.
            state=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$service" \
              --no-cli-pager --output json)
            if ! jq -e --arg service "$service" --arg deployment "$deployment_id" '
              (.failures | length) == 0 and (.services | length) == 1 and
              (.services[0] |
                .serviceName == $service and .status == "ACTIVE" and
                .desiredCount > 0 and .runningCount == .desiredCount and .pendingCount == 0 and
                (.deployments | length) == 1 and
                .deployments[0].id == $deployment and .deployments[0].status == "PRIMARY" and
                .deployments[0].rolloutState == "COMPLETED")
              ' <<< "$state" > /dev/null; then
              echo "::error::요청한 배포가 완료되지 않았거나 이전 배포로 롤백됐다: $service"
              exit 1
            fi
            echo "배포 완료: $service ($deployment_id)"
            echo '::endgroup::'
          }

          deploy_service "$ECS_SERVICE_ENROLLMENT_API"
          deploy_service "$ECS_SERVICE_TELEMETRY_INGEST"
