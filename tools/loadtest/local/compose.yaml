# 부하 시험 로컬 E2E 의 저장소·Kafka·OTel Collector (ADR 0082). scripts/telemetry-kafka-e2e/compose.yaml 을 복사해 고쳤다 —
# 데몬을 빼고 OTel Collector 를 더했으며, 포트를 원본(3xxxx)·개발용 docker-compose.yml 과 겹치지 않게 4xxxx 로 옮겼다.
# 프로젝트 이름은 run.sh 가 정한다. 모든 포트는 루프백에만 연다.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulsemetry
      POSTGRES_USER: pulsemetry
      POSTGRES_PASSWORD: pulsemetry
    ports:
      - "127.0.0.1:45432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsemetry -d pulsemetry"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:48123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 운영 MSK 처럼 자동 topic 생성을 끄고 message 상한을 13 MiB 로 둔다. 호스트 앱은 localhost:49092 로 붙는다.
  kafka:
    image: apache/kafka:3.9.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:49092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:49092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_MESSAGE_MAX_BYTES: "13631488"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "13631488"
    ports:
      - "127.0.0.1:49092:49092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:49092 > /dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 10s
      retries: 30

  # dev 와 같은 6 partition. 시드 생성기가 설치를 partition 마다 같은 수로 고른다.
  kafka-init:
    image: apache/kafka:3.9.2
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:29092
      - --create
      - --if-not-exists
      - --topic
      - pulsemetry-loadtest-telemetry-ingress
      - --partitions
      - "6"
      - --replication-factor
      - "1"
      - --config
      - max.message.bytes=13631488
      - --config
      - retention.ms=259200000

  # dev Job 의 sidecar 와 같은 core 배포판·같은 설정. k6 가 compose 네트워크에서 otel-collector:4318 로 보내고,
  # 호스트는 127.0.0.1:49404/metrics 로 Prometheus 형식을 읽는다(dev 는 PodMonitor 가 :9404 를 pull 한다).
  otel-collector:
    image: otel/opentelemetry-collector:0.161.0@sha256:b6d2b9a85b1029d05b5ad913150c1f014eed4ae99be81a1813ca5ade4a191913
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:49404:9404"
