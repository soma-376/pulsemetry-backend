# 로컬 E2E 의 저장소·Kafka·데몬 (docs/telemetry-kafka-e2e.md). 개발용 docker-compose.yml 과 이름·포트가 겹치지 않는다 —
# 프로젝트 이름은 run.sh 가 정한다. 모든 포트는 루프백에만 연다.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulsemetry
      POSTGRES_USER: pulsemetry
      POSTGRES_PASSWORD: pulsemetry
    ports:
      - "127.0.0.1:35432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsemetry -d pulsemetry"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:38123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 운영 MSK 처럼 자동 topic 생성을 끄고 message 상한을 13 MiB 로 둔다. 호스트 앱은 localhost:39092 로 붙는다.
  kafka:
    image: apache/kafka:3.9.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:39092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:39092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_MESSAGE_MAX_BYTES: "13631488"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "13631488"
    ports:
      - "127.0.0.1:39092:39092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:39092 > /dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.2
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:29092
      - --create
      - --if-not-exists
      - --topic
      - pulsemetry-e2e-telemetry-ingress
      - --partitions
      - "6"
      - --replication-factor
      - "1"
      - --config
      - max.message.bytes=13631488
      - --config
      - retention.ms=259200000

  # 수정하지 않은 telemetryctl(develop 빌드)을 키링이 있는 Linux 에서 돌린다. 바이너리는 run.sh 가 mount 한다.
  daemon:
    build:
      context: .
      dockerfile: daemon.Dockerfile
    image: pulsemetry-e2e-daemon:proj245
    # PID 1 이 프록시(python)라 끝난 데몬을 거두지 못한다 — init 이 좀비를 거둬야 재기동 전 종료를 확인할 수 있다.
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${E2E_BIN_DIR:?run.sh 가 정한다}:/opt/e2e-bin:ro
