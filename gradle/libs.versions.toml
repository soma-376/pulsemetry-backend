[versions]
kotlin = "2.3.21"
springBoot = "4.1.0"
springDependencyManagement = "1.1.7"
jdk = "25"
# Spring Boot BOM 이 관리하지 않는다. 계약 테스트에서만 쓴다.
jsonSchemaValidator = "3.0.6"
# 아래 셋도 Spring Boot BOM 밖이다 — 텔레메트리 수집 모듈이 처음 끌어온다 (PROJ-114).
# OTLP 와이어 포맷의 진실원은 상위 opentelemetry-proto 다.
otelProto = "1.11.0-alpha"
protobuf = "4.36.1"
# 아카이브 적재 (ADR 0012). BOM 을 import 해 하위 모듈 버전을 맞춘다.
awsSdk = "2.40.11"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
# @Entity·@Embeddable 에 no-arg 생성자를 넣어 준다. Hibernate 가 인스턴스를 만들려면 필요하다.
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }

# 버전이 없는 항목은 Spring Boot BOM 이 버전을 결정한다.
[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
# ORM 은 JPA(Hibernate) 다 (PLAN.md L3).
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

# 인증 계층 (ADR 0007). :libs:security 는 starter 를 쓰지 않는다 —
# starter 가 딸고 오는 자동설정 모듈은 클래스패스만 보고 발동해서
# 이 라이브러리를 올린 모든 앱의 엔드포인트를 잠근다 (ADR 0011).
# 버전은 Boot BOM 이 import 하는 spring-security-bom 이 정한다.
spring-security-core = { module = "org.springframework.security:spring-security-core" }
spring-security-web = { module = "org.springframework.security:spring-security-web" }
# 서블릿 컨테이너가 런타임에 제공한다. 라이브러리는 compileOnly 로만 쓴다.
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api" }

# 스키마의 진실원은 Flyway SQL 마이그레이션이다 (ADR 0004 / PLAN.md L4).
# Spring Boot 4 는 자동설정을 모듈로 쪼갰다. flyway-core 만으로는 기동 시 마이그레이션이 돌지 않는다.
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

# 통합 테스트는 실제 PostgreSQL 로만 돌린다. H2 등 임베디드 DB 로 대체하지 않는다 (PLAN.md L6).
# Testcontainers 2.x 부터 아티팩트 이름에 testcontainers- 접두사가 붙는다.
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
# 적재 모듈의 sink 테스트는 실제 ClickHouse 로만 돌린다 — ReplacingMergeTree 의 FINAL dedup 이
# 판정 대상이라 대역으로 대체할 수 없다 (:libs:telemetry-persistence, PROJ-104).
# 전용 모듈(testcontainers-clickhouse)을 쓰지 않는 이유는 그것이 JdbcDatabaseContainer 라
# 기동 대기에 ClickHouse JDBC 드라이버를 요구하기 때문이다 — 우리 sink 는 HTTP 로만 말한다.
testcontainers = { module = "org.testcontainers:testcontainers" }

# 계약 테스트가 telemetryctl/contracts/*.schema.json 을 오라클로 쓴다 (PLAN.md R3).
# 3.x 는 Jackson 3(tools.jackson) 기반이라 Spring Boot 4.1 과 같은 Jackson 을 쓴다.
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }

# --- 텔레메트리 수집 (:libs:telemetry-collector, PROJ-114) ---
# OTLP 메시지의 가변 모델. protobuf-java 생성 클래스의 Builder 를 그대로 쓴다.
# 상위 README 가 "not intended for production use" 를 달았지만, 대안은 .proto 벤더링뿐이고
# 우리가 쓰는 것은 생성된 메시지 타입과 그 디스크립터뿐이라 그 경고의 사정거리 밖이다 (ADR 0012).
opentelemetry-proto = { module = "io.opentelemetry.proto:opentelemetry-proto", version.ref = "otelProto" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
# OTLP/JSON 코덱이 쓰는 스트리밍 파서. databind 는 쓰지 않는다 — 디스크립터로 직접 순회한다.
# Boot BOM 이 tools.jackson(Jackson 3) 을 관리하므로 버전을 적지 않는다.
jackson-core = { module = "tools.jackson.core:jackson-core" }
# 아카이브 적재 대상 (ADR 0012). BOM 으로 하위 모듈 버전을 맞춘다.
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awsSdk" }
awssdk-s3 = { module = "software.amazon.awssdk:s3" }
