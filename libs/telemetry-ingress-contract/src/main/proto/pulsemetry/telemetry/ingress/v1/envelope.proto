// Gateway 가 접수한 OTLP/HTTP 요청 하나를 담는 Kafka record 값 (ADR 0066 Decision 4).
//
// HTTP 요청 하나가 record 하나다. 본문은 디코딩·마스킹하지 않은 원문 그대로다 — Kafka 에는 마스킹 전 데이터가 남는다.
// Bearer 원문은 어디에도 싣지 않는다. 인증 문맥은 Gateway 가 검증한 JWT 의 claim 에서만 만든다.
//
// 필드를 바꾸면 schema_version 을 올리고 TelemetryEnvelopeCodec 의 검증을 함께 고친다. 번호를 재사용하지 않는다.
syntax = "proto3";

package pulsemetry.telemetry.ingress.v1;

import "google/protobuf/timestamp.proto";

option java_package = "com.team376.pulsemetry.telemetry.ingress.proto";
option java_multiple_files = true;
option java_outer_classname = "TelemetryEnvelopeProto";

message TelemetryEnvelope {
  // 지금은 1 이다. Consumer 는 아는 판만 받고 나머지는 영구 실패로 확정한다.
  uint32 schema_version = 1;
  // Gateway 가 만든 UUID(정규 소문자 표기). Consumer 의 receipt ID 가 된다.
  string message_id = 2;
  // 발행 직전에 확정하고 토큰 시간을 다시 검증한 접수 시각. Consumer 의 receivedAt 이 된다.
  google.protobuf.Timestamp accepted_at = 3;
  AuthContext auth = 4;
  OtlpPayload payload = 5;
}

// RDB 판정 전의 인증 문맥. Consumer 가 jti 로 자격 기록을 읽어 하나씩 대조한다.
message AuthContext {
  // jti = telemetry_tokens.id
  string credential_id = 1;
  string tenant_id = 2;
  // sub
  string installation_id = 3;
  string issuer = 4;
  string key_id = 5;
  int64 issued_at_epoch_seconds = 6;
  int64 expires_at_epoch_seconds = 7;
}

message OtlpPayload {
  Signal signal = 1;
  // 정규화한 media type — application/json 또는 application/x-protobuf.
  string content_type = 2;
  // 정규화한 Content-Encoding — 빈 문자열·identity·none·gzip·zlib·deflate.
  string content_encoding = 3;
  // 받은 본문 바이트 그대로. 압축을 풀지 않았다.
  bytes body = 4;
}

enum Signal {
  SIGNAL_UNSPECIFIED = 0;
  SIGNAL_LOGS = 1;
  SIGNAL_TRACES = 2;
  SIGNAL_METRICS = 3;
}
